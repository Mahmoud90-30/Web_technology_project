<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Recipe – Kitchen Chaos Club</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Lato:wght@300;400;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="edit.css">
</head>
<body>

<nav>
    <a href="index.html"> Home</a>
    <a href="main course.html">Main Course</a>
    <a href="appetizer.html">Appetizers</a>
    <a href="Desserts.html">Desserts</a>
</nav>

<h1 class="page-title">
    <span>Kitchen Chaos Club</span>
    <br>
    <i>✏️ Edit Recipe</i>
</h1>

<div class="form-wrapper">

    <!-- Not Found State -->
    <div id="not-found" style="display:none;" class="not-found">
        <div class="nf-icon">🍽️</div>
        <p>Recipe not found!</p>
        <a href="index.html" class="back-link">← Back to Home</a>
    </div>

    <!-- Edit Form -->
    <div id="edit-form">

        <div class="category-badge" id="category-badge"></div>

        <!-- Recipe Name -->
        <div class="form-group">
            <label><b>🍽️ Recipe Name</b></label>
            <input type="text" id="recipe-name" placeholder="Recipe name">
        </div>

        <!-- Image -->
        <div class="form-group">
            <label>📷 Recipe Image</label>
            <div class="current-img-wrap" id="current-img-wrap" style="display:none;">
                <img id="current-img" src="" alt="current image">
                <span class="current-label">Current image</span>
            </div>
            <label class="file-label" for="recipe-image">
                <span class="file-icon">📷</span>
                <span>Click to upload a new image (optional)</span>
            </label>
            <input type="file" id="recipe-image" accept="image/*">
            <img id="img-preview" src="" alt="preview" style="display:none;">
        </div>

        <hr class="form-divider">

        <!-- Ingredients -->
        <div class="form-group">
            <label>📝 Ingredients <span class="hint">(each ingredient on a new line)</span></label>
            <textarea id="ingredients" placeholder="e.g.&#10;2 cups flour&#10;1 egg&#10;Salt to taste"></textarea>
        </div>

        <!-- Steps -->
        <div class="form-group">
            <label>➡️ Preparation Steps <span class="hint">(each step on a new line)</span></label>
            <textarea id="steps" placeholder="e.g.&#10;Mix ingredients&#10;Bake for 30 minutes"></textarea>
        </div>

        <!-- Buttons -->
        <div class="btn-row">
            <button class="submit-btn" onclick="saveEdit()">💾 Save Changes</button>
            <button class="delete-btn" onclick="openModal()">🗑️ Delete Recipe</button>
        </div>

    </div><!-- /edit-form -->

</div><!-- /form-wrapper -->

<!-- Toast -->
<div id="edit-toast"></div>

<!-- Delete Confirm Modal -->
<div id="confirm-modal" class="modal-overlay">
    <div class="modal-box">
        <div class="modal-icon">⚠️</div>
        <p class="modal-msg">Are you sure you want to <strong>delete</strong> this recipe?<br>This action cannot be undone.</p>
        <div class="modal-btns">
            <button class="confirm-yes" onclick="confirmDelete()">Yes, Delete</button>
            <button class="confirm-no"  onclick="closeModal()">Cancel</button>
        </div>
    </div>
</div>

<script src="edit.js"></script>
</body>
</html>
