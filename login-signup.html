<!DOCTYPE html>
<html lang="en" id="auth-page">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen Chaos Club</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>

<body>

    <div class="container" id="container">

        <div class="form-container sign-up-container">
            <div class="form-content">
                <div class="form-header">
                    <h2>Sign Up</h2>
                    <p class="subtitle">Join our restaurant family today.</p>
                </div>

                <form method="post">
                    <div class="input-group">
                        <label for="reg-username">Username</label>
                        <input type="text" id="reg-username" name="username" placeholder="Choose a username" required>
                    </div>

                    <div class="input-group">
                        <label for="reg-email">Email Address</label>
                        <input type="email" id="reg-email" name="email" placeholder="email@example.com" required>
                    </div>

                    <div class="input-group">
                        <label for="reg-password">Password</label>
                        <input type="password" id="reg-password" name="password" placeholder="Create a strong password"
                            required>
                    </div>

                    <div class="input-group">
                        <label for="reg-confirm-password">Confirm Password</label>
                        <input type="password" id="reg-confirm-password" name="confirm_password"placeholder="Confirm your password" required>
                    </div>

                    <div class="input-group">
                        <label for="reg-role">Account Type</label>
                        <select id="reg-role" name="role" required>
                            <option value="" disabled selected>Select your role</option>
                            <option value="Admin">Admin</option>
                            <option value="User">User</option>
                        </select>
                    </div>

                    <button type="submit" class="submit-btn">Create Account</button>

                    <div class="footer-text">
                        <p>Already have an account? <button type="button" id="signIn">Login</button></p>
                    </div>
                </form>
            </div>
        </div>

        <div class="form-container sign-in-container">
            <div class="form-content">
                <div class="form-header">
                    <h2>Login</h2>
                    <p class="subtitle">Welcome back! Please enter your credentials.</p>
                </div>

                <form method="post">
                    <div class="Email input-group">
                        <label for="login-email">Email Address</label>
                        <input type="email" id="login-email" name="email" required placeholder="Enter your email">
                    </div>

                    <div class="password input-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" name="password" required
                            placeholder="Enter your password">
                    </div>

                    <button type="submit" class="submit-btn" id="loginBtn">Login</button>

                    <div class="footer-text">
                        <p>Don't have an account? <button type="button" id="signUp">Sign Up</button></p>
                    </div>

                    <div class="home-link">
                        <a href="Home page.html">Back to Home</a>
                    </div>
                </form>
            </div>
        </div>

        <div class="overlay-container">
            <div class="overlay">
                <div class="overlay-panel overlay-left">
                    <span>Kitchen Chaos Club</span>
                </div>
                <div class="overlay-panel overlay-right">
                    <span>Kitchen Chaos Club</span>
                </div>
            </div>
        </div>

    </div>

</body>

</html>
