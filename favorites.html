     <style>
        
        body {
            background: linear-gradient(135deg, #f3d9a5, #e9c98a);
            font-family: Georgia, 'Times New Roman', Times, serif;
            margin: 0;
        }
 
        .page-title {
            text-align: center;
            color: #b5341a;
            font-size: 2.4rem;
            margin: 30px 0 10px;
            font-family: Georgia, serif;
        }
 
        
        .fav-recipe-wrapper {
            background: #fff8f2;
            border-radius: 20px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.10);
            margin: 40px auto;
            max-width: 960px;
            padding: 30px 40px 20px;
            position: relative;
        }
 
        
        .fav-remove-bar {
            text-align: center;
            margin-top: 20px;
        }
        .remove-fav-btn {
            background: none;
            border: 2px solid #cc3300;
            color: #cc3300;
            padding: 8px 22px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-family: Georgia, serif;
            transition: 0.3s;
        }
        .remove-fav-btn:hover {
            background: #cc3300;
            color: white;
        }
 
        .fav-divider {
            border: none;
            border-top: 2px dashed #e0b080;
            margin: 30px 0 0;
        }
 
       
        .fav-recipe-content img {
            float: right;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            margin: 0 0 20px 30px;
            object-fit: cover;
        }
        .fav-recipe-content img:hover {
            border-radius: 30px;
        }
 
       
        .fav-recipe-content::after {
            content: '';
            display: block;
            clear: both;
        }
 
       
        nav { text-align: center; padding: 14px; }
        nav a {
            text-decoration: none; color: white;
            background-color: rgb(18,104,5);
            padding: 8px 16px; border-radius: 10px;
            margin: 5px; display: inline-block;
            transition: 0.3s; font-family: Georgia, serif; font-size: larger;
        }
        nav a:hover { background-color: rgb(102,211,13); }
 
        @media (max-width: 700px) {
            .fav-recipe-wrapper { padding: 20px 16px; }
            .fav-recipe-content img { float: none; width: 100%; height: 220px; margin: 0 0 16px 0; border-radius: 16px; }
        }
    </style>


</head>
