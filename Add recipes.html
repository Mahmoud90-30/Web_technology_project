<html>
<head>
    <title>Add recipes</title>
</head>

<body>

<center>

<font face="Arial" color="darkred">
<h1><i>Add a Recipe</i></h1>
</font>

<form>

<!--Category-->
<font face="Verdana" size="4">
<label><b>Choose the category of your recipe</b></label>
</font>

<br><br>

<select name="Category">
    <option>Main Course</option>
    <option>Desserts</option>
    <option>Appetizer</option>
</select>

<br><br>


<!--Recipe Name -->
<font face="Verdana" size="4">
<label><b>Recipe Name :</b></label>
</font>

<br><br>

<input type="text" name="recipe_name">

<br><br>


<!--Recipe Image-->
<font face="Verdana" size="4">
<label><b>Upload the recipe image</b></label>
</font>

<br><br>

<input type="file" name="recipe_image">

<br><br>


<!--Ingredients and Steps-->
<font face="Verdana" size="4">
<label><b>Recipe ingredients and steps :</b></label>
</font>

<br><br>

<input type="text" name="recipe">

<br><br>

<input type="submit" value="Add Recipe">

</form>

</center>

</body>
</html>
