<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width , initial-scale= 0.1">
    <title>Add recipes</title>
    <link rel="stylesheet" href="Add_recipes.css">
</head>

<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="main course.html">main course</a>
        <a href="appetizer.html">Appetizers</a>
        <a href="Desserts.html">Dessert</a>

    </nav>

<h1 class="page-title">
    <span>Kitchen Chaos Club</span>
    <br>
    <i>Add a Recipe</i></h1>
    


<div class="form-wrapper">

<!--Category-->
<div class="form-group">
<label><b>Choose the category of your recipe</b></label>
<select id="Category">
    <option value="main-course">Main Course</option>
    <option value="desserts">Desserts</option>
    <option value="appetizer">Appetizer</option>
</select>
</div>

<br><br>


<!--Recipe Name -->
<div>
<label><b>🍽️ Recipe Name :</b></label>
<input type="text" id="recipe-name" placeholder="e.g. Grilled Chicken">
</div>


<br><br>


   <!-- Image -->
    <div class="form-group">
        <label>📷 Recipe Image</label>
        <label class="file-label" for="recipe-image">
            <span class="file-icon">📷</span>
            <span>Click to upload an image</span>
        </label>
        <input type="file" id="recipe-image" accept="image/*">
        <img id="img-preview" src="" alt="preview">
    </div>
 
    <hr class="form-divider">

  <!-- Ingredients -->
    <div class="form-group">
        <label>📝 Ingredients <span class="hint">(each ingredient on a new line)</span></label>
        <textarea id="ingredients" placeholder="e.g.&#10;2 cups flour&#10;1 egg&#10;Salt to taste"></textarea>
    </div>
 
    <!-- Steps -->
    <div class="form-group">
        <label>➡️ Preparation Steps <span class="hint">(each step on a new line)</span></label>
        <textarea id="steps" placeholder="e.g.&#10;Mix the flour and egg&#10;Add salt&#10;Bake for 30 minutes"></textarea>
    </div>
 
    <button class="submit-btn" onclick="addRecipe()">✅ Add Recipe</button>
 
</div>
 
<div id="add-toast"></div>

<script src="Add_recipes.js">
</script>

</body>
</html>
